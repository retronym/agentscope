[tasks.serve]
description = "Run the live dashboard on http://localhost:8377"
run = "python3 -u agentscope.py"

[tasks.demo]
description = "Export an anonymized static demo to dist/index.html (needs gh auth; reads your local sessions)"
run = "python3 demo/export.py --out dist/index.html"

[tasks.demo-serve]
description = "Export the demo and serve dist/ on http://localhost:8380"
depends = ["demo"]
run = "python3 -m http.server 8380 --bind 127.0.0.1 --directory dist"

[tasks.publish-demo]
description = "Force-push dist/index.html to the gh-pages branch (GitHub Pages). Run `mise run demo` first."
run = """
set -euo pipefail
test -f dist/index.html || { echo "no dist/index.html: run 'mise run demo' first"; exit 1; }
tmp=$(mktemp -d)
cp dist/index.html "$tmp/"
touch "$tmp/.nojekyll"
# date the commit at the demo's own (shifted) snapshot time, so git doesn't record when the real export happened
when=$(python3 -c "import json,re,sys; h=open('dist/index.html').read(); print(int(json.loads(h.split('window.STATIC_DATA = ',1)[1].split(';</script>',1)[0].replace(r'<\\\\/','</'))['state']['now']))")
git -C "$tmp" init -q -b gh-pages
git -C "$tmp" add -A
GIT_AUTHOR_DATE="@$when +0000" GIT_COMMITTER_DATE="@$when +0000" \
  git -C "$tmp" -c user.name="$(git config user.name)" -c user.email="$(git config user.email)" commit -q -m "agentscope demo (synthetic data)"
git -C "$tmp" push -q -f "$(git remote get-url origin)" gh-pages
rm -rf "$tmp"
echo "pushed gh-pages"
"""

[tasks.demo-fixture]
description = "Record the demo's JVM profiles: sbt, javac and a small service building public code, about 10 minutes. Needs sbt and `mise run build-profiler`."
run = "python3 demo/record_fixture.py"

[tasks.screenshots]
description = "Regenerate docs/screenshots from dist/index.html with headless Chromium. Run `mise run demo` first."
run = "python3 demo/screenshots.py"

[tasks.build-profiler]
description = "Build the JVM helper (profiler/target/agentscope-profiler.jar) that takes thread dumps and other snapshots"
run = "cd profiler && ./mvnw -q -B package"

[tasks.bench-overhead]
description = "Measure the slowdown agentscope's JFR recording causes on a javac workload (about 7 minutes)"
run = "cd profiler && ./mvnw -q -B test-compile && java --add-exports jdk.attach/sun.tools.attach=ALL-UNNAMED -cp target/classes:target/test-classes:$(./mvnw -q -B dependency:build-classpath -Dmdep.outputFile=/dev/stdout) agentscope.profiler.OverheadBench 60 15 10"

[tasks.check]
description = "Parse every page script and compile the Python (catches a broken static/*.js before it blanks the page)"
run = """
set -e
for f in static/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "syntax error in $f"; exit 1; }; done
python3 -m py_compile agentscope.py jvm.py helper.py recording.py profiles.py captures.py demo/export.py demo/record_fixture.py demo/screenshots.py
echo "ok"
"""

[tasks.install-agent]
description = "Run the dashboard as a launchd agent (starts at login, restarts if it dies) so load history is always recorded. Logs to ~/Library/Logs/agentscope.log"
run = """
set -euo pipefail
label=com.retronym.agentscope
plist="$HOME/Library/LaunchAgents/$label.plist"
python=$(command -v python3)
esc() { sed -e 's/&/\\&amp;/g' -e 's/</\\&lt;/g' -e 's/>/\\&gt;/g' <<<"$1"; }
mkdir -p "$HOME/Library/LaunchAgents" "$HOME/Library/Logs"
# launchd starts agents with a bare PATH: bake in this shell's, so gh, java, ps and lsof resolve as they do here
cat > "$plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>$label</string>
  <key>ProgramArguments</key><array><string>$(esc "$python")</string><string>-u</string><string>$(esc "$PWD/agentscope.py")</string></array>
  <key>WorkingDirectory</key><string>$(esc "$PWD")</string>
  <key>EnvironmentVariables</key><dict>
    <key>PATH</key><string>$(esc "$PATH")</string>
    $([ -n "${JAVA_HOME:-}" ] && echo "<key>JAVA_HOME</key><string>$(esc "$JAVA_HOME")</string>")
  </dict>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
  <key>ThrottleInterval</key><integer>15</integer>
  <key>ProcessType</key><string>Background</string>
  <key>StandardOutPath</key><string>$(esc "$HOME/Library/Logs/agentscope.log")</string>
  <key>StandardErrorPath</key><string>$(esc "$HOME/Library/Logs/agentscope.log")</string>
</dict></plist>
PLIST
plutil -lint -s "$plist"
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
echo "installed $plist; http://localhost:8377, logs in ~/Library/Logs/agentscope.log"
"""

[tasks.uninstall-agent]
description = "Stop and remove the launchd agent"
run = """
label=com.retronym.agentscope
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
rm -f "$HOME/Library/LaunchAgents/$label.plist"
echo "removed $label"
"""
